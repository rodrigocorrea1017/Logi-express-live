<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LogiExpress</title><style>body{font:16px system-ui;background:#eef3f8;color:#14283e;margin:0}header{background:#102c49;color:white;padding:24px}main{max-width:850px;margin:auto;padding:20px}button,input,select{font:inherit;padding:12px;border:1px solid #ccd5df;border-radius:9px;margin:4px}button{background:#1264b0;color:white;cursor:pointer}section{background:white;padding:18px;border-radius:14px;margin:14px 0}iframe{width:100%;height:330px;border:0}small{color:#52657a}</style><header><h1>LogiExpress</h1>Gestión de última milla · Santiago</header><main><small>Demostración académica · datos ficticios y almacenamiento local</small><section><button onclick="show('admin')">Administrador</button><button onclick="show('driver')">Conductor</button><button onclick="show('client')">Cliente</button></section><section id="panel"></section><section><h2>Mapa de Santiago</h2><iframe src="https://www.openstreetmap.org/export/embed.html?bbox=-70.76%2C-33.52%2C-70.52%2C-33.36&layer=mapnik"></iframe><p id="gps">GPS no activado</p></section></main><script>let orders=JSON.parse(localStorage.getItem('le')||'[{"id":"LE1001","status":"Pendiente","scan":false},{"id":"LE1002","status":"Pendiente","scan":false}]');let role='admin';const p=document.getElementById('panel');function save(){localStorage.setItem('le',JSON.stringify(orders));show(role)}function show(r){role=r;p.replaceChildren();let h=document.createElement('h2');h.textContent={admin:'Torre de control',driver:'Ruta del conductor',client:'Seguimiento de pedido'}[r];p.append(h);if(r==='client'){let i=document.createElement('input');i.placeholder='Código LE1001';p.append(i);let b=document.createElement('button');b.textContent='Consultar';b.onclick=()=>alert(orders.find(o=>o.id===i.value)?.status||'No encontrado');p.append(b);return}for(let o of orders){let line=document.createElement('p');line.textContent=o.id+' · '+o.status+' · '+(o.scan?'Escaneado':'Sin escanear');p.append(line);if(r==='driver'){let b=document.createElement('button');b.textContent='Escanear (demo)';b.onclick=()=>{o.scan=true;save()};p.append(b)}}if(r==='driver'){let b=document.createElement('button');b.textContent='Iniciar ruta';b.onclick=()=>{if(!orders.every(o=>o.scan))return alert('Faltan paquetes');orders.forEach(o=>o.status='En ruta');save()};p.append(b);let g=document.createElement('button');g.textContent='Activar GPS local';g.onclick=()=>navigator.geolocation.getCurrentPosition(x=>document.getElementById('gps').textContent='Ubicación local: '+x.coords.latitude.toFixed(5)+', '+x.coords.longitude.toFixed(5),e=>alert(e.message));p.append(g)}else{let b=document.createElement('button');b.textContent='Agregar pedido de prueba';b.onclick=()=>{let id=prompt('Código');if(id&&!orders.some(o=>o.id===id)){orders.push({id,status:'Pendiente',scan:false});save()}};p.append(b)}}show(role)</script></html>
