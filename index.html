<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LogiExpress</title><style>body{font:16px system-ui;background:#eef3f8;color:#14283e;margin:0}header{background:#102c49;color:white;padding:24px}main{max-width:850px;margin:auto;padding:20px}button,input,select{font:inherit;padding:12px;border:1px solid #ccd5df;border-radius:9px;margin:4px}button{background:#1264b0;color:white;cursor:pointer}section{background:white;padding:18px;border-radius:14px;margin:14px 0}iframe{width:100%;height:330px;border:0}small{color:#52657a}</style><header><h1>LogiExpress</h1>Gestión de última milla · Santiago</header><main><section id="auth"><h2>Bienvenido a LogiExpress</h2><p>Inicia sesión o crea una cuenta de demostración.</p><form id="loginform"><input id="nombre" placeholder="Nombre completo" hidden><input id="correo" type="email" placeholder="Correo electrónico" required><input id="clave" type="password" placeholder="Contraseña (mínimo 8 caracteres)" minlength="8" required><select id="perfil" hidden><option value="client">Cliente</option><option value="driver">Conductor</option><option value="admin">Administrador (demo)</option></select><button id="submitAuth">Iniciar sesión</button><button type="button" id="toggleAuth">Registrarse</button><p id="errorAuth"></p></form></section><div id="privateArea" hidden><small>Demostración académica · datos ficticios y almacenamiento local</small><section><strong id="who"></strong> <button onclick="logout()">Cerrar sesión</button></section><section id="panel"></section><section><h2>Mapa de Santiago</h2><iframe src="https://www.openstreetmap.org/export/embed.html?bbox=-70.76%2C-33.52%2C-70.52%2C-33.36&layer=mapnik"></iframe><p id="gps">GPS no activado</p></section></div></main><script>let orders=JSON.parse(localStorage.getItem('le')||'[{"id":"LE1001","status":"Pendiente","scan":false},{"id":"LE1002","status":"Pendiente","scan":false}]');let role='admin';const p=document.getElementById('panel');function save(){localStorage.setItem('le',JSON.stringify(orders));show(role)}function show(r){role=r;p.replaceChildren();let h=document.createElement('h2');h.textContent={admin:'Torre de control',driver:'Ruta del conductor',client:'Seguimiento de pedido'}[r];p.append(h);if(r==='client'){let i=document.createElement('input');i.placeholder='Código LE1001';p.append(i);let b=document.createElement('button');b.textContent='Consultar';b.onclick=()=>alert(orders.find(o=>o.id===i.value)?.status||'No encontrado');p.append(b);return}for(let o of orders){let line=document.createElement('p');line.textContent=o.id+' · '+o.status+' · '+(o.scan?'Escaneado':'Sin escanear');p.append(line);if(r==='driver'){let b=document.createElement('button');b.textContent='Escanear (demo)';b.onclick=()=>{o.scan=true;save()};p.append(b)}}if(r==='driver'){let b=document.createElement('button');b.textContent='Iniciar ruta';b.onclick=()=>{if(!orders.every(o=>o.scan))return alert('Faltan paquetes');orders.forEach(o=>o.status='En ruta');save()};p.append(b);let g=document.createElement('button');g.textContent='Activar GPS local';g.onclick=()=>navigator.geolocation.getCurrentPosition(x=>document.getElementById('gps').textContent='Ubicación local: '+x.coords.latitude.toFixed(5)+', '+x.coords.longitude.toFixed(5),e=>alert(e.message));p.append(g)}else{let b=document.createElement('button');b.textContent='Agregar pedido de prueba';b.onclick=()=>{let id=prompt('Código');if(id&&!orders.some(o=>o.id===id)){orders.push({id,status:'Pendiente',scan:false});save()}};p.append(b)}}let registering=false;const el=id=>document.getElementById(id);el('toggleAuth').onclick=()=>{registering=!registering;el('nombre').hidden=!registering;el('nombre').required=registering;el('perfil').hidden=!registering;el('submitAuth').textContent=registering?'Crear cuenta':'Iniciar sesión';el('toggleAuth').textContent=registering?'Ya tengo cuenta':'Registrarse'};function enter(u){el('auth').hidden=!!u;el('privateArea').hidden=!u;if(u){el('who').textContent=u.name+' · '+({admin:'Administrador',driver:'Conductor',client:'Cliente'}[u.role]);show(u.role)}}el('loginform').onsubmit=async e=>{e.preventDefault();try{let r=await fetch(registering?'/register':'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:el('nombre').value,email:el('correo').value,password:el('clave').value,role:el('perfil').value})});let d=await r.json();if(!r.ok)throw Error(d.error);el('clave').value='';enter(d.user)}catch(e){el('errorAuth').textContent=e.message}};async function logout(){await fetch('/logout',{method:'POST'});enter(null)}fetch('/me').then(r=>r.json()).then(d=>enter(d.user));</script></html>
